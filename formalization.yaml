automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        statements and their fidelity check against Bamberg-Cairns-Kilminster, the Lean proofs, the
        standard-library replay of the tables, the literature and prior-art searches, and the repository
        text; Claude Fable 5.1 pinned the statements, merged the proof files and wrote the documents, Claude
        Opus 5.5 subagents wrote the proofs, the checkers and the audits. Lean v4.35.0-rc2 and Mathlib
        v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest
        and lake update is never run; there are no GitHub Actions workflows. There is no native_decide. The
        proofs use Mathlib's minimal and cyclotomic polynomials over Q, AdjoinRoot with its power basis and
        the left-multiplication matrix for the blocks, Nat.recOnPosPrimePosCoprime for the induction over the
        factorization, and decide +kernel over a structurally recursive trial-division computation of psi
        (proved equal to psi) for the tables and the values beyond dimension 12. The odd squarefree
        witnesses use Mathlib's Bertrand postulate; the invariant form is the Gram sum of the powers of the
        matrix; the determinant -1 theorem uses that form and a Bezout identity for the cyclotomic factor
        X + 1.
      spend_usd: "not tracked"
    - method: "agent"
      models: ["GPT-6 Pro (OpenAI)"]
      framework: "ChatGPT"
      tool_setup: >-
        A pre-submission consult on 2026-10-10 reviewed the repository and contributed the seven statements
        of Crystallographic/Extensions.lean and Crystallographic/InvariantForm.lean with their Lean proofs,
        the paper proofs of the determinant -1 threshold and of the class count of PROOF.md section 12 with
        scripts/check_minimal_classes.py, and the page references to Vaidyanathaswamy's two 1928 notes;
        Claude re-derived and verified these, proved the determinant -1 threshold in Lean, integrated them
        and wrote the final documents.
      spend_usd: "not tracked"

fidelity:
  divergences: >-
    The source states Theorem 1 as Ord_n = {m in N | psi(m) <= n} with no restriction on n; it is stated
    here for N >= 1 and m >= 1, since GL(0, Z) is trivial while psi(2) = 0 and Lean's orderOf is 0 at
    infinite order (finiteOrders N excludes orderOf A = 0 by the clause 0 < m). psi is defined on all
    natural numbers with psi(0) = 0 (Nat.factorization 0 = 0), a convention the source does not need. The
    tables are stated as Set N literals equal to finiteOrders N, where the source's Table 1 prints the
    differences psi^{-1}{n} for even n; the twelve tables N = 1, ..., 12 contain the same information as
    its rows n <= 12. The values beyond dimension 12 (psi(2520) = 20, psi(2310) = 22, nine values with
    psi = 24) are not in the source: they are the values above 2000 that rows 20, 22, 24 of its Table 1
    omit, found while checking the table, and are stated here as values of psi and as least dimensions.
    Proposition 3(2) of the source is stated for even n >= 2; exists_odd_squarefree_psi_eq also covers 0
    (m = 1) and records the odd squarefree witness of its proof. finiteOrders_subset_iff,
    finiteOrders_eq_iff and exists_new_odd_squarefree_order are not stated in the source; they follow
    from Theorem 1, the parity of p. 203 and Proposition 3(2). The source's remark (p. 202) that Ord_n is
    the set of orders of lattice symmetries is formalized for integral forms:
    exists_integral_posDef_isometry_iff chooses the form with the matrix (the Gram sum of the powers,
    Serre's construction without division); positive definiteness is Mathlib's Matrix.PosDef over Z and
    again over R (equivalent for a symmetric integer matrix; IsSymm is part of PosDef); the form's
    unimodularity, the isometry group of a given form and integral conjugacy are not addressed. The
    determinant -1 threshold is not in the sources; its necessity goes through the invariant form and
    the cyclotomic factor X + 1 of the minimal polynomial. The count of rational conjugacy classes at the
    least dimension (PROOF.md section 12) is a paper proof outside the Lean interface. GL(N, Z) is
    Matrix.GeneralLinearGroup (Fin N) Z, the units of the matrix ring, and orderOf is Mathlib's order of a
    unit. The equivalence over Q, the dimension-0 and monotonicity statements, the block of size phi(n)
    for every n, the arithmetic lemmas on psi, the SL(N, Z) version, the half-dimension statements, the
    invariant form and the determinant -1 threshold are additions of this development (the source speaks
    of GL(n, Z) only).

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents developed
    the proofs and audited them in separate passes; the statements were checked against the authors' PDF of
    Bamberg-Cairns-Kilminster (pp. 202-204 and 207) and the printed pages of Vaidyanathaswamy's two 1928
    notes (pp. 121-124 and 268-272), Hiller and Kuzmanovich-Pavlichenkov being read in abstract only;
    psi, the twelve tables and the maxima were recomputed outside Lean by two independent routes and
    against OEIS A080737, A080738, A080740, A005417 and A152455, and the class count of PROOF.md section 12
    and the determinant -1 threshold by exhaustive enumeration for orders up to 500. Mechanical
    correctness and agreement of formal statements do not establish priority or significance.

alignment:
  namespace: "Crystallographic"
  statements:
    - source: "this development"
      lean: "Crystallographic.psi_eq_zero_iff"
      module: "Solution"
      status: "proved"
      note: "ψ(m) = 0 iff m ≤ 2."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (the definition of psi)"
      lean: "Crystallographic.psi_prime_pow"
      module: "Solution"
      status: "proved"
      note: "ψ(pᵏ) = φ(pᵏ) for a prime power pᵏ ≠ 2."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (the definition of psi)"
      lean: "Crystallographic.psi_mul"
      module: "Solution"
      status: "proved"
      note: "ψ(ab) = ψ(a) + ψ(b) for coprime a, b."
    - source: "this development"
      lean: "Crystallographic.psi_le_totient"
      module: "Solution"
      status: "proved"
      note: "ψ(m) ≤ φ(m)."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 203 (parity)"
      lean: "Crystallographic.even_psi"
      module: "Solution"
      status: "proved"
      note: "ψ(m) is even."
    - source: "this development"
      lean: "Crystallographic.psi_eq_sum_divisors"
      module: "Solution"
      status: "proved"
      note: "ψ(m) as the sum of φ(d) over the exact prime-power divisors d ≠ 2 of m."
    - source: "this development"
      lean: "Crystallographic.le_two_pow_psi"
      module: "Solution"
      status: "proved"
      note: "m ≤ 2^(ψ(m) + 1) for m ≥ 1."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (Theorem 1)"
      lean: "Crystallographic.psi_orderOf_le"
      module: "Solution"
      status: "proved"
      note: "ψ(orderOf A) ≤ N for every A ∈ GL(N, ℤ) (necessity)."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (Theorem 1)"
      lean: "Crystallographic.exists_orderOf_eq"
      module: "Solution"
      status: "proved"
      note: "For N ≥ 1, m ≥ 1, ψ(m) ≤ N there is A ∈ GL(N, ℤ) of order m (sufficiency)."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (Theorem 1)"
      lean: "Crystallographic.exists_orderOf_eq_iff"
      module: "Solution"
      status: "proved"
      note: "The crystallographic restriction: for N ≥ 1, m ≥ 1, GL(N, ℤ) has an element of order m iff ψ(m) ≤ N."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 202 (Theorem 1)"
      lean: "Crystallographic.finiteOrders_eq"
      module: "Solution"
      status: "proved"
      note: "The finite orders of GL(N, ℤ), N ≥ 1, are {m ≥ 1 : ψ(m) ≤ N}."
    - source: "OEIS A152455; Bamberg-Cairns-Kilminster 2003, p. 202 (Theorem 1)"
      lean: "Crystallographic.isLeast_dimension"
      module: "Solution"
      status: "proved"
      note: "The least N carrying an element of order m ≥ 1 is ψ(m), or 1 for m = 2."
    - source: "this development"
      lean: "Crystallographic.exists_orderOf_eq_totient"
      module: "Solution"
      status: "proved"
      note: "GL(φ(n), ℤ) has an element of order n, for every n ≥ 1."
    - source: "this development"
      lean: "Crystallographic.exists_orderOf_eq_iff_rat"
      module: "Solution"
      status: "proved"
      note: "The same restriction for GL(N, ℚ)."
    - source: "this development"
      lean: "Crystallographic.finiteOrders_zero"
      module: "Solution"
      status: "proved"
      note: "GL(0, ℤ) has only the order 1."
    - source: "this development"
      lean: "Crystallographic.finiteOrders_mono"
      module: "Solution"
      status: "proved"
      note: "The finite orders grow with the dimension."
    - source: "Bamberg-Cairns-Kilminster 2003, p. 203 (parity)"
      lean: "Crystallographic.finiteOrders_succ_of_even"
      module: "Solution"
      status: "proved"
      note: "GL(N + 1, ℤ) has the same finite orders as GL(N, ℤ) for even N ≥ 2."
    - source: "this development"
