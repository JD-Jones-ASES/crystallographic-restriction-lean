sources:
  - title: "The Crystallographic Restriction, Permutations, and Goldbach's Conjecture"
    authors: ["John Bamberg", "Grant Cairns", "Devin Kilminster"]
    id: "doi:10.1080/00029890.2003.11919956"
    type: "paper"
    location: "The American Mathematical Monthly 110 (2003), no. 3, 202-209 (JSTOR 3647934): p. 202 (Ord_n, the finite orders of GL(n, Z); the definition of psi with psi(2) = 0 and psi(1) = 0; Theorem 1, Ord_n = {m in N | psi(m) <= n}); p. 203 (psi is even, so Ord_{2k+1} = Ord_{2k}); p. 204 (Table 1, the rows psi^{-1}{n} for even n <= 24); p. 207 (Proposition 3(2), psi^{-1}{n} nonempty for every even n >= 2, and its proof by distinct odd primes; psi maps N onto the even nonnegative integers). The text read is the authors' PDF at cage.ugent.be, which carries the Monthly's page numbers."
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The statement formalized: Theorem 1, with psi as defined on p. 202, for every N >= 1 and m >= 1
      (the source's Ord_n read at n = 0 would contain 2, since psi(2) = 0, while GL(0, Z) is trivial;
      Lean's orderOf is 0 at infinite order, hence m >= 1). The parity remark of p. 203 is formalized as
      finiteOrders (N + 1) = finiteOrders N for even N >= 2, and the rows n <= 12 of Table 1 are reproduced
      by the tables for N = 1, ..., 12. The source states Theorem 1 without proof, citing Vaidyanathaswamy
      (1928) for it and Kuzmanovich-Pavlichenkov (2002) for a proof; the proof here (the minimal polynomial
      over Q is a product of distinct cyclotomic polynomials, psi <= phi and additivity; for sufficiency,
      multiplication by a root on Z[X]/(Phi_{p^k}) and block sums) is the standard argument, the cyclotomic
      route of Vaidyanathaswamy's notes (the next two entries). Proposition 3(2) and its proof (p. 207) are
      formalized as exists_odd_squarefree_psi_eq and, with the parity of p. 203, as range_psi;
      finiteOrders_subset_iff, finiteOrders_eq_iff and exists_new_odd_squarefree_order are derived from
      them with Theorem 1; the remark of p. 202 that Ord_n is the set of orders of lattice symmetries is
      formalized for integral forms as exists_integral_posDef_isometry_iff.
      Rows n = 20, 22 and 24 of Table 1 omit their values
      above 2000 (2520; 2310; 2184, 2340, 2640, 2730, 2772, 3080, 3960, 4620, 5040; the largest printed
      entry is 1980); these values of psi and the least dimensions they give are theorems here.
  - title: "Integer-Roots of the Unit Matrix"
    authors: ["R. Vaidyanathaswamy"]
    id: "doi:10.1112/jlms/s1-3.2.121"
    type: "paper"
    location: "Journal of the London Mathematical Society s1-3 (1928), no. 2, 121-124: p. 122 (section 1, the companion matrix; the matrices up to integral conjugacy left open), pp. 122-123 (section 2, equations (2) and (3)), p. 123 (section 3). The text read is the scan of the printed volume at the Central University Library, Iasi (dspace.bcu-iasi.ro, handle 123456789/43233)."
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      In the 1928 vocabulary the order of a matrix is its dimension and its period is its order. p. 122:
      the companion matrix realizes any monic integer polynomial. pp. 122-123: Omega^r = 1 iff the
      invariant factors are linear and the latent roots are r-th roots of unity; the characteristic
      polynomial is then a product of cyclotomic factors P_d^x with d | r, the period is exactly r iff the
      d have least common multiple r, the dimension is the sum of x phi(d), and block sums of companion
      matrices realize every solution. p. 123: finitely many periods in each dimension; its list for
      dimension 2 omits the period 6, corrected in a footnote on p. 272 of the next entry. The proofs here
      take the same route; nothing is transcribed from it.
  - title: "On the Possible Periods of Integer-Matrices"
    authors: ["R. Vaidyanathaswamy"]
    id: "doi:10.1112/jlms/s1-3.4.268"
    type: "paper"
    location: "Journal of the London Mathematical Society s1-3 (1928), no. 4, 268-272: p. 268 (Theorem I, condition (2)), p. 269 (section 2; Lemma I), p. 270 (Lemma II; Theorem II), p. 271 (equality in (4) only for 3 and 2^2; the period 2r from an odd period r), p. 272 (section 5: the growth with the dimension, each r > 2 a primitive period of the n given by (7), Theorems III-V, the footnote). The text read is the same scan."
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      Theorem I, p. 268: for r = 2^m p_1^{a_1} ... p_l^{a_l} (distinct odd primes p_i), an integer matrix
      of dimension n and period r exists iff phi(2^m) + phi(p_1^{a_1}) + ... + phi(p_l^{a_l}) <= n when
      m > 1, and phi(p_1^{a_1}) + ... + phi(p_l^{a_l}) <= n when m = 0 or 1: that is, psi(r) <= n, the
      statement of exists_orderOf_eq_iff and of Theorem 1 of Bamberg-Cairns-Kilminster, who cite this
      note and the previous one for it. The proof (pp. 269-271) exhibits solutions of the equations of the
      previous entry and bounds the sum of phi(d_i) below over distinct d_i != 1 with least common multiple
      r (Theorem II, p. 270, which read literally fails at r = 2, where that minimum is phi(2) = 1;
      isLeast_dimension treats m = 2 apart). p. 271: the product of the totients of distinct prime powers
      other than 2 equals their sum only for 3 and 4 (used in PROOF.md section 12), and an odd period r
      gives the period 2r in the same dimension (exists_orderOf_eq_two_mul). p. 272: a period of
      dimension n is one of every larger dimension (finiteOrders_mono); no odd dimension n >= 3 has a
      period that n - 1 lacks (Theorem III; finiteOrders_succ_of_even); each r > 2 is first a period in
      dimension psi(r) (isLeast_dimension); Theorems IV and V describe the periods new in dimension n
      through prime powers; a footnote corrects p. 123 of the previous entry (dimension 2 has the periods
      2, 3, 4 and 6).
  - title: "The crystallographic restriction in higher dimensions"
    authors: ["H. Hiller"]
    id: "doi:10.1107/S0108767385001180"
