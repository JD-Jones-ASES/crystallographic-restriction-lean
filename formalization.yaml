status:
  scope: >-
    Fifty-six compared theorems over the two definitions of Challenge.lean (psi and finiteOrders), neither
    a hole. The arithmetic of psi (zero set, prime powers, additivity, psi <= phi, parity, the divisor-sum
    form, m <= 2^(psi(m) + 1)); necessity, psi(orderOf A) <= N for every element of GL(N, Z); sufficiency
    for N >= 1, m >= 1, psi(m) <= N; the equivalence; finiteOrders N = {m | 0 < m and psi m <= N} for
    N >= 1; the least dimension (psi(m), or 1 for m = 2); an element of GL(phi(n), Z) of order n for every
    n >= 1; the equivalence over Q; finiteOrders 0 = {1}; monotonicity in N; finiteOrders (N + 1) =
    finiteOrders N for even N >= 2; every finite order is at most 2^(N + 1) and the set is finite; the
    twelve tables N = 1, ..., 12 as explicit sets; the maxima in dimensions 1, 2, 4, 6, 8, 10, 12; the
    values psi(2520) = 20, psi(2310) = 22 and psi = 24 at nine further integers, with the least dimensions
    20, 22, 24 they give; the same equivalence in SL(N, Z) for N >= 2, and SL(1, Z) trivial. Also: every
    even number is psi(m) for an odd squarefree m, and the values of psi are the even numbers; for
    N, M >= 1, finiteOrders N is contained in (equal to) finiteOrders M iff N / 2 <= M / 2 (N / 2 = M / 2);
    an odd squarefree order of dimension 2n + 2 that 2n + 1 lacks; a symmetric integral form, positive
    definite over Z and R, preserved by each element of finite order; for N, m >= 1, an element of order
    m preserving a positive definite integral form iff psi(m) <= N; and, for m >= 1, an element of order m
    and determinant -1 in GL(N, Z) iff m is even and psi(m) + 1 <= N, with the least dimension psi(m) + 1
    for even m, also over Q. The count of rational conjugacy classes at the least dimension (PROOF.md
    section 12) is a paper proof, not compared. Not claimed: priority for the two- and three-dimensional
    cases (public Lean proofs of the case N = 2 exist); the wallpaper or space groups; the isometry group
    of a given lattice or form; integral conjugacy. The intentional placeholders of
    Challenge.lean are excluded from proof counts; Solution.lean does not import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

