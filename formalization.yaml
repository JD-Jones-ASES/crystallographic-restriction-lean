version: "v0.4"

project:
  name: "The crystallographic restriction in every dimension: GL(N, Z) has an element of order m if and only if psi(m) <= N, with the finite-order tables for N <= 12, the least dimension of each order, and the same equivalence over Q"
  description: >-
    A Lean 4 development of the crystallographic restriction in every dimension. For a positive integer m
    let psi(m) be the sum of phi(p^k) over the prime powers p^k exactly dividing m, except that the prime
    power 2 contributes 0 (phi is Euler's totient; psi(1) = psi(2) = 0, psi(3) = psi(4) = psi(6) = 2,
    psi(ab) = psi(a) + psi(b) for coprime a, b; OEIS A080737). Theorem (Vaidyanathaswamy 1928; Hiller
    1985; a proof in Kuzmanovich-Pavlichenkov 2002; Theorem 1 of Bamberg-Cairns-Kilminster 2003): for
    N >= 1, the group GL(N, Z) of invertible integer N x N matrices has an element of order m >= 1 if and
    only if psi(m) <= N. The development proves both directions: necessity through the minimal polynomial
    of the matrix over Q, which divides X^m - 1 and is therefore a product of distinct cyclotomic
    polynomials whose indices have least common multiple m, so that psi(m) is at most its degree;
    sufficiency by one block of size phi(p^k) for each prime power p^k != 2 of m (multiplication by the
    root on Z[X]/(Phi_{p^k}) in its power basis), the sign -1 when m is 2 modulo 4, and an identity block.
    Corollaries: the finite orders of GL(N, Z) are the positive m with psi(m) <= N; the least dimension
    carrying an element of order m is psi(m), or 1 for m = 2 (OEIS A152455); GL(phi(n), Z) has an element
    of order n for every n >= 1; the same equivalence holds for GL(N, Q); GL(0, Z) has only the order 1 and
    the finite orders grow with the dimension; GL(N + 1, Z) has the finite orders of GL(N, Z) for even
    N >= 2; the set of finite orders is finite and bounded by 2^(N + 1). The arithmetic of psi: psi(m) = 0
    iff m <= 2; psi(p^k) = phi(p^k) for a prime power p^k != 2; additivity on coprime factors; psi <= phi;
    psi is even; psi as a sum over the exact prime-power divisors; m <= 2^(psi(m) + 1). The tables of
    finite orders for N = 1, ..., 12 (OEIS A080738) and the largest finite order 2, 6, 12, 30, 60, 120, 210
    in dimensions 1, 2, 4, 6, 8, 10, 12 are proved by the bound and a kernel computation of psi. Beyond
    dimension 12, the eleven orders 2520 (psi = 20), 2310 (psi = 22) and 2184, 2340, 2640, 2730, 2772,
    3080, 3960, 4620, 5040 (psi = 24), which rows 20, 22 and 24 of Table 1 of Bamberg-Cairns-Kilminster
    omit, are checked with their least dimensions. The hypotheses N >= 1 and m >= 1 are necessary and
    explicit: GL(0, Z) is trivial while psi(2) = 0, and orderOf is 0 at infinite order. Not claimed: any
    first formalization of the two-dimensional case (public Lean proofs exist), the wallpaper or space
    groups, isometry groups, or statements about SL(N, Z).
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

