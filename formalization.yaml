version: "v0.4"

project:
  name: "The crystallographic restriction in every dimension: for N, m >= 1, GL(N, Z) has an element of order m if and only if psi(m) <= N, also in SL(N, Z) for N >= 2, with the tables for N <= 12, the least dimension of each order, the determinant -1 threshold psi(m) + 1, and the same over Q"
  description: >-
    A Lean 4 development of the crystallographic restriction in every dimension. For a positive integer m
    let psi(m) be the sum of phi(p^k) over the prime powers p^k exactly dividing m, except that the prime
    power 2 contributes 0 (phi is Euler's totient; psi(1) = psi(2) = 0, psi(3) = psi(4) = psi(6) = 2,
    psi(ab) = psi(a) + psi(b) for coprime a, b; OEIS A080737). Theorem (Vaidyanathaswamy 1928; Hiller
    1985; a proof in Kuzmanovich-Pavlichenkov 2002; Theorem 1 of Bamberg-Cairns-Kilminster 2003): for
    N >= 1, the group GL(N, Z) of invertible integer N x N matrices has an element of order m >= 1 if and
    only if psi(m) <= N. The development proves both directions: necessity through the minimal polynomial
    of the matrix over Q, which divides X^m - 1 and is therefore a product of distinct cyclotomic
    polynomials whose indices have least common multiple m, so that psi(m) is at most its degree;
    sufficiency by one block of size phi(p^k) for each prime power p^k != 2 of m (multiplication by the
    root on Z[X]/(Phi_{p^k}) in its power basis), the sign -1 when m is 2 modulo 4, and an identity block.
    Corollaries: the finite orders of GL(N, Z) are the positive m with psi(m) <= N; the least dimension
    carrying an element of order m is psi(m), or 1 for m = 2 (OEIS A152455); GL(phi(n), Z) has an element
    of order n for every n >= 1; the same equivalence holds for GL(N, Q); GL(0, Z) has only the order 1 and
    the finite orders grow with the dimension; GL(N + 1, Z) has the same finite orders as GL(N, Z) for
    even N >= 2; the set of finite orders is finite and bounded by 2^(N + 1). The arithmetic of psi: psi(m) = 0
    iff m <= 2; psi(p^k) = phi(p^k) for a prime power p^k != 2; additivity on coprime factors; psi <= phi;
    psi is even; psi as a sum over the exact prime-power divisors; m <= 2^(psi(m) + 1). The tables of
    finite orders for N = 1, ..., 12 (OEIS A080738) and the largest finite order 2, 6, 12, 30, 60, 120, 210
    in dimensions 1, 2, 4, 6, 8, 10, 12 are proved by the bound and a kernel computation of psi. Beyond
    dimension 12, the eleven orders 2520 (psi = 20), 2310 (psi = 22) and 2184, 2340, 2640, 2730, 2772,
    3080, 3960, 4620, 5040 (psi = 24), which rows 20, 22 and 24 of Table 1 of Bamberg-Cairns-Kilminster
    omit, are checked with their least dimensions. The same equivalence holds in SL(N, Z) for N >= 2 (an
    element of odd order has determinant 1; the block for 2^k, k >= 2, has even size and determinant 1; -A
    keeps the determinant in even dimension), and SL(1, Z) is trivial. Every even number is psi(m) for an
    odd squarefree m (Proposition 3(2) of Bamberg-Cairns-Kilminster and its proof), so for N, M >= 1 the
    finite orders of GL(N, Z) are among those of GL(M, Z) iff N / 2 <= M / 2 (integer division); every
    element of finite order m of GL(N, Z) preserves the symmetric integral form sum_{k<m} (A^k)^T A^k,
    positive definite on integer and real vectors, so psi(m) <= N is also the condition for an element of
    order m of GL(N, Z) preserving a positive definite integral form; and GL(N, Z) has an element of order
    m >= 1 and determinant -1 iff m is even and psi(m) + 1 <= N, so the least such dimension is psi(m) + 1
    for even m (also over Q). The hypotheses N >= 1 and m >= 1 are
    necessary and explicit: GL(0, Z) is trivial while psi(2) = 0, and orderOf is 0 at infinite order. The
    theorem is the standard description of the finite orders of integer matrices, used in the crystallography
    of higher-dimensional lattices and quasicrystals and in integral representation theory; Mathlib's
    docs/1000.yaml (Q3527223) and mathlib4 issue #6091 (item 60) list it unformalized, and as of 2026-10-09 no
    formalization in every dimension, in either direction, was located in the registry, Mathlib, the Lean
    repositories searched, the Isabelle AFP or arXiv. Not claimed: priority for the two- and three-dimensional
    cases (public Lean proofs of the case N = 2 exist), the wallpaper or space groups, the isometry group of a
    given lattice or form, or integral conjugacy.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

